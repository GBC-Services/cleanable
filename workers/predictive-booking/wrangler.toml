# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Cloudflare Worker — Predictive Booking Recommendations
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
#  Analyses a Resident's booking history + current weather to generate
#  proactive cleaning recommendations via Workers AI (Llama 3.2 3B).
#
#  Endpoints:
#    POST /recommend  — generate predictive recommendations
#    GET  /health     — basic health check
#
#  Environment variables (set via `wrangler secret put`):
#    CLEANABLE_API_KEY — internal API key for authenticating requests
#    WEATHER_API_KEY   — OpenWeatherMap API key
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name = "cleanable-predictive-booking"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
