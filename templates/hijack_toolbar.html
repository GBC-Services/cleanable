{% if request.user.is_hijacked %}
    <div id="djhj">
        <div class="container-fluid bg-grey p-3">
            <div class="row">
                <div class="col-lg-9">
                    You are currently working on behalf of <em>{{ user }}</em>.
                </div>
                <div class="col-lg-3">
                    <form action="{% url 'hijack:release' %}" method="POST" class="djhj-actions">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.path }}">
                        <button class="btn btn-primary" onclick="document.getElementById('djhj').style.display = 'none';"
                                type="button">
                            hide
                        </button>
                        <button class="btn btn-danger" type="submit">
                            release
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endif %}
