<script defer="" src="//api.mapbox.com/search-js/v1.0.0-beta.16/web.js"></script>
<script>
    let autofillCollection;
    function setValidationText(color, msg, clear = false) {
        validatation_el = $("#validation_msg");
        if (clear){
            validatation_el.addClass("d-none");
        }
        validatation_el.removeClass("color-green", "color-red");
        validatation_el.addClass(`color-${color}`);
        validatation_el.text(msg);
        validatation_el.removeClass("d-none");
    }

    // You can wrap this in $(document).ready(...) or similar
    $(function() {
        // We only want to initialize the Mapbox Autofill if the user actually tries to use it.
        // For example, we can attach to the "focus" event on the address input:
        $("#id_address").on("focus", function() {
            // Once the user focuses the address input, we check with the server:
            checkAndInitializeAutofill();
        });
    });


    function checkAndInitializeAutofill() {
        // Remove the event listener so we don't recheck each time the user focuses in/out
        $("#id_address").off("focus");

        data = {
            "csrfmiddlewaretoken": $("#csrf_getting_form").find("[name='csrfmiddlewaretoken']").val()
        }
        url = "{% url 'log_mapbox_request' %}";
        // 1. AJAX call to your local check-limit endpoint
        $.ajax({
            url: url,
            method: 'POST',
            data: data,
            success: function(response) {
                if (response.is_allowed) {
                    // 2. If allowed, proceed with Autofill initialization
                    initializeMapboxAutofill();
                } else {
                    // 3. If not allowed, disable input or show message
                    $("#id_address").prop("disabled", true);
                    alert("We have reached the usage limit for Address Autofill. Please try again later.");
                }
            },
            error: function(xhr, status, error) {
                console.error("Error checking usage limit:", error);
                // Decide how to handle server/connection errors.
                // For safety, you might want to disable or skip to avoid any unexpected charges.
                $("#id_address").prop("disabled", true);
                alert("Could not confirm usage limit. Address Autofill is disabled.");
            }
        });
    }

    // Autofill initialization
    function initializeMapboxAutofill() {
        mapboxsearch.config.accessToken = "{{ mapbox_token }}";
        autofillCollection = mapboxsearch.autofill({
            options: { country: 'us' }
        });

        $("[name='address address-search']").attr("name", "address");

        const minimap = new MapboxAddressMinimap();

        minimap.canAdjustMarker = true;
        minimap.satelliteToggle = true;
        minimap.footer = false;

        $("#minimap_container").html(minimap);
        window.minimap = minimap;

        feature = $("#id_feature").val();
        if(feature){
            window.minimap.feature = JSON.parse(feature);
            $("#minimap_container").removeClass("d-none");
        }
        minimap.onSaveMarkerLocation = (coordinates) => {
            coordinates = coordinates;
            feature = $("#id_feature").val();
            if(feature){
                feature = JSON.parse(feature);
                feature.geometry.coordinates = coordinates;
                $("#id_feature").val(JSON.stringify(feature));
            }
        };

        autofillCollection.addEventListener(
            "retrieve",
            async (e) => {
                feature = e.detail.features[0];
                $("#id_feature").val(JSON.stringify(feature));
                window.minimap.feature = feature;
                $("#minimap_container").removeClass("d-none");
            }
        );
    }

    $("form [type='submit']").on("click", async function(e){
        e.preventDefault();

        form = $(this).closest("form");
        js_form = form[0];
        result = await mapboxsearch.confirmAddress(js_form, {
            minimap: true,
            skipConfirmModal: (feature) =>
                ['exact', 'high'].includes(
                    feature.properties.match_code.confidence
                )
        });
        if (result.type === 'nochange'){
            form.submit();
        }else{
            feature = result.feature;
            $("#id_feature").val(JSON.stringify(feature));
            form.submit();
        }
    });
</script>
